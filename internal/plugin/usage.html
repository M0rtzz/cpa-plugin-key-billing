<script>
  (() => {
    const key = "cpa-key-billing.theme";
    let mode = "system";
    try {
      const stored = localStorage.getItem(key);
      if (["system", "dark", "light"].includes(stored)) mode = stored;
    } catch (_) {}
    document.documentElement.dataset.themeMode = mode;
    document.documentElement.dataset.theme =
      mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  })();
</script>

<script>
  (() => {
    "use strict";
    const BASE = "/v0/resource/plugins/cpa-key-billing";
    const $ = (id) => document.getElementById(id);
    const integer = (value) => Number(value || 0).toLocaleString("zh-CN", { maximumFractionDigits: 0 });
    const money = (value) => {
      const amount = Number(value || 0);
      const maximumFractionDigits = amount !== 0 && Math.abs(amount) < 0.01 ? 10 : 4;
      return "$" + amount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits });
    };
    const percent = (value) => (Number.isFinite(Number(value)) && value != null ? Number(value).toFixed(1) + "%" : "未提供");
    const when = (value) =>
      value && Number.isFinite(new Date(value).getTime()) ? new Date(value).toLocaleString("zh-CN", { hour12: false }) : "尚无记录";
    const duration = (value) => {
      const milliseconds = Number(value);
      if (!Number.isFinite(milliseconds) || milliseconds <= 0) return "—";
      return milliseconds < 1000 ? integer(milliseconds) + " ms" : (milliseconds / 1000).toFixed(2) + "s";
    };
    const factor = (value, fallback = 1) => (typeof value === "number" && Number.isFinite(value) && value > 0 ? value : fallback);
    const factorText = (value) => factor(value).toLocaleString("zh-CN", { maximumSignificantDigits: 12 }) + "×";
    function glyph(name) {
      const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), path = document.createElementNS(ns, "path");
      const paths = {
        input: "M12 3v18m-7-7 7 7 7-7",
        output: "M12 21V3m-7 7 7-7 7 7",
        cache: "M4 8h16v12H4zM3 4h18v4H3zM9 12h6",
        write: "M4 8h16v12H4zM3 4h18v4H3zM9 14h6m-3-3v6",
        image: "M3 3h18v18H3zM3 16l5-5 5 5 3-3 5 5M15 7h.01",
        info: "M12 11v6m0-10h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"
      };
      for (const [key, value] of Object.entries({
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        "stroke-width": "1.6",
        "aria-hidden": "true",
        class: "glyph"

      );
      const labels = node("div", null, "chart-labels");
      labels.append(node("span", when(points[0].time)), node("span", when(points[points.length - 1].time)));
      parent.append(labels);
    }
    function renderRecords(value) {
      total = Number(value.total) || 0;
      snapshot = String(value.snapshot_id || snapshot);
      closeDetail();
      if (value.filter_options?.models) modelOptions = value.filter_options.models;
      const parent = clear("records"), entries = value.entries || [];
      if (!entries.length) empty(parent, tab === "errors" ? "所选范围内暂无错误记录" : "所选范围内暂无请求记录");
      else {
        const table = node("table"), head = node("thead"), row = node("tr");
        for (const label of tab === "errors"
          ? ["时间", "模型", "HTTP 状态", "错误类型", "错误说明"]
          : ["时间", "模型", "类型", "状态", "推理强度", "Token", "费用（USD）", "耗时"])
          row.append(node("th", label));
        head.append(row);
        table.append(head);
        const body = node("tbody");
        for (const entry of entries) {
          const tr = node("tr");
          const values =
            tab === "errors"
              ? [
                  when(entry.at),
                  entry.billing_model || entry.upstream_model || "—",
                  entry.status_code || "—",
                  entry.error_type || "未提供",
                  entry.reason || "未提供错误说明"
                ]
              : [
                  when(entry.at),
                  entry.billing_model || entry.upstream_model || "—",
                  typeCell(entry),
                  entry.failed ? "失败" : "成功",
                  entry.reasoning_effort || "—",
                  tokenCell(entry),
                  costCell(entry),
                  timing(entry)
                ];
          values.forEach((value, index) => {
            const cell = node("td", null, tab === "errors" && index === 4 ? "message" : "");
            if (value instanceof Node) cell.append(value); else cell.textContent = String(value);
            tr.append(cell);
          });
          body.append(tr);
        }
        table.append(body);
        parent.append(table);
      }
      const pages = pageCount(), current = Math.floor(offset / PAGE_SIZE) + 1, select = clear("page-select");
      $("page-label").textContent = "共 " + integer(total) + " 条 · 第 " + current + " / " + pages + " 页";
      const options = document.createDocumentFragment();
      for (let page = 1; page <= pages; page++) {
        const option = node("option", "第 " + integer(page) + " 页");
        option.value = String(page);
        options.append(option);
      }
      select.append(options);
      select.value = String(current);
      select.disabled = pages <= 1;
      $("first-page").disabled = $("previous").disabled = offset === 0;
      $("last-page").disabled = $("next").disabled = offset + PAGE_SIZE >= total;
    }
    function pageCount() { return Math.max(1, Math.ceil(total / PAGE_SIZE)); }
    function recordState() { return { range, tab, offset, snapshot, model, requestType }; }
    async function fetchRecords(state) {
      const params = new URLSearchParams(state.range);
      params.set("offset", state.offset);
      params.set("limit", PAGE_SIZE);
      if (state.snapshot) params.set("snapshot_id", state.snapshot);
      if (state.model) params.set("model", state.model);
      if (state.tab === "events" && state.requestType) params.set("request_type", state.requestType);
      return api("/" + state.tab + "?" + params);
    }
    function commitRecords(state, value) {
      ({ range, tab, offset, snapshot, model, requestType } = state);
      $("model-filter").value = model;
      $("type-filter").value = requestType;
      $("type-filter-label").hidden = tab === "errors";
      for (const name of ["events", "errors"]) $(name + "-tab").setAttribute("aria-selected", String(name === tab));
      renderRecords(value);
    }
    async function loadRecords(state = recordState()) {
      let value = await fetchRecords(state);
      const lastOffset = Math.max(0, Math.ceil((Number(value.total) || 0) / PAGE_SIZE) - 1) * PAGE_SIZE;
      if (state.offset > lastOffset) {
        state = { ...state, offset: lastOffset, snapshot: String(value.snapshot_id ?? state.snapshot) };
        value = await fetchRecords(state);
      }
      commitRecords(state, value);
    }
    function closeModelOptions() {
      $("model-options").hidden = true;
      $("model-filter").setAttribute("aria-expanded", "false");
      $("model-toggle").setAttribute("aria-expanded", "false");
      $("model-toggle").setAttribute("aria-label", "展开模型选项");
    }
    function showModelOptions(showAll = false) {
      const parent = clear("model-options"), needle = showAll === true ? "" : $("model-filter").value.toLowerCase();
      const options = ["", ...modelOptions.filter((value) => value.toLowerCase().includes(needle))];
      for (const value of options) {
        const option = node("button", value || "全部模型");
        option.type = "button";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", String(value === model));
        option.onclick = () => {
          closeModelOptions();
          void operation(() => loadRecords({ ...recordState(), model: value, offset: 0, snapshot: "" }));
        };
        parent.append(option);
      }
      parent.hidden = false;
      $("model-filter").setAttribute("aria-expanded", "true");
      $("model-toggle").setAttribute("aria-expanded", "true");
      $("model-toggle").setAttribute("aria-label", "收起模型选项");
    }
    $("model-toggle").onclick = () => { if ($("model-options").hidden) showModelOptions(true); else closeModelOptions(); };
    $("model-toggle").onkeydown = (event) => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        showModelOptions(true);
        $("model-options").querySelector("button")?.focus();
      }
    };
    $("model-filter").oninput = showModelOptions;
    $("model-filter").onfocus = showModelOptions;
    $("model-filter").onkeydown = (event) => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        showModelOptions();
        $("model-options").querySelector("button")?.focus();
      }
      if (event.key === "Enter") {
        event.preventDefault();
        const exact = modelOptions.find((value) => value === $("model-filter").value);
        if (exact || !$("model-filter").value) {
          closeModelOptions();
          void operation(() => loadRecords({ ...recordState(), model: exact || "", offset: 0, snapshot: "" }));
        } else showModelOptions();
      }
    };
    $("model-options").onkeydown = (event) => {
      if (["ArrowDown", "ArrowUp"].includes(event.key)) {
        event.preventDefault();
        const options = [...$("model-options").querySelectorAll("button")], index = options.indexOf(document.activeElement);
        options[(index + (event.key === "ArrowDown" ? 1 : options.length - 1)) % options.length]?.focus();
      }
    };
    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".model-picker")) {
        closeModelOptions();
        $("model-filter").value = model;
      }
    });
    $("model-filter").closest(".model-picker").addEventListener("focusout", (event) => {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        closeModelOptions();
        $("model-filter").value = model;
      }
    });
    $("model-filter").closest(".model-picker").addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModelOptions();
        $("model-filter").value = model;
        $("model-toggle").focus();
      }
    });
    $("type-filter").onchange = () => {
      const nextType = $("type-filter").value;
      void operation(() => loadRecords({ ...recordState(), requestType: nextType, offset: 0, snapshot: "" }));
    };
    $("clear-record-filters").onclick = () =>
      operation(() => loadRecords({ ...recordState(), model: "", requestType: "", offset: 0, snapshot: "" }));
    async function operation(callback, silentUnauthorized = false) {
      if (busy) return;
      busy = true;
      closeDetail();
      closeModelOptions();
      const version = generation;
      const loginButton = $("login").querySelector("button");
      loginButton.disabled = true;
      $("key").disabled = true;
      $("dashboard").classList.add("busy");
      $("dashboard").inert = true;
      $("dashboard").setAttribute("aria-busy", "true");
      message("正在加载…");
      try {
        await callback();
        if (version === generation) message("");
      } catch (error) {
        if (error.name !== "AbortError" && !(silentUnauthorized && error.status === 401)) message(error.message, true);
        else if (error.name === "AbortError" && version === generation) message("请求超时，请稍后重试", true);
      } finally {
        busy = false;
        loginButton.disabled = false;
        $("key").disabled = false;
        $("dashboard").classList.remove("busy");
        $("dashboard").inert = false;
        $("dashboard").setAttribute("aria-busy", "false");
        $("model-filter").value = model;
        $("type-filter").value = requestType;
        $("page-select").value = String(Math.floor(offset / PAGE_SIZE) + 1);
      }
    }
    async function loadDashboard() {
      const profile = await api("/profile");
      if (!profile.tracked) {
        await endSession();
        resetView();
        throw new Error("该 API Key 暂无可用账单，请联系管理员");
      }
      $("identity").textContent = profile.identity?.label || profile.identity?.preview || "当前 API Key";
      await reloadDashboard(selectedRange());
      showDashboard();
    }
    $("login").onsubmit = (event) => {
      event.preventDefault();
      if (busy) return;
      const apiKey = $("key").value.trim();
      $("key").value = "";
      if (!apiKey) return;
      stopRequests();
      operation(async () => {
        await establishSession(apiKey);
        await loadDashboard();
      });
    };
    async function reloadDashboard(nextRange) {
      const state = { ...recordState(), range: nextRange, offset: 0, snapshot: "" };
      const [summary, records] = await Promise.all([api("/analysis?" + nextRange), fetchRecords(state)]);
      renderAnalysis(summary);
      commitRecords(state, records);
    }
    $("filter").onsubmit = (event) => {
      event.preventDefault();
      void operation(() => reloadDashboard(selectedRange()));
    };
    $("refresh").onclick = () => operation(() => reloadDashboard(range));
    $("refresh-records").onclick = () => operation(() => loadRecords({ ...recordState(), offset: 0, snapshot: "" }));
    $("trend-metric").onchange = renderTrend;
    for (const value of ["events", "errors"])
      $(value + "-tab").onclick = () => operation(() => loadRecords({ ...recordState(), tab: value, offset: 0, snapshot: "" }));
    function goToPage(page) {
      return operation(async () => {
        if (Number.isInteger(page) && page >= 1 && page <= pageCount() && (page - 1) * PAGE_SIZE !== offset)
          await loadRecords({ ...recordState(), offset: (page - 1) * PAGE_SIZE });
      });
    }
    $("first-page").onclick = () => goToPage(1);
    $("previous").onclick = () => goToPage(Math.floor(offset / PAGE_SIZE));
    $("next").onclick = () => goToPage(Math.floor(offset / PAGE_SIZE) + 2);
    $("last-page").onclick = () => goToPage(pageCount());
    $("page-select").onchange = () => goToPage(Number($("page-select").value));
    operation(loadDashboard, true);
  })();
</script>
</body>
</html>
